  <polyline points="410.0,361.3 470.0,357.1 530.0,343.1 590.0,293.0" fill="none" stroke="#3D5A98" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="410.0" cy="361.3" r="4.5" fill="#3D5A98" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="470.0" cy="357.1" r="4.5" fill="#3D5A98" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="530.0" cy="343.1" r="4.5" fill="#3D5A98" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="590.0" cy="293.0" r="4.5" fill="#3D5A98" stroke="#FFFFFF" stroke-width="2"/>
  <polyline points="410.0,365.6 470.0,365.4 530.0,364.7 590.0,362.1" fill="none" stroke="#B4690E" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="410.0" cy="365.6" r="4.5" fill="#B4690E" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="470.0" cy="365.4" r="4.5" fill="#B4690E" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="530.0" cy="364.7" r="4.5" fill="#B4690E" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="590.0" cy="362.1" r="4.5" fill="#B4690E" stroke="#FFFFFF" stroke-width="2"/>
  <text class="sans val" x="598.0" y="226.2">$0.26</text>
  <text class="sans val" x="598.0" y="298.0">$0.13</text>
  <text class="sans val" x="598.0" y="365.1">$0.007</text>
  <text class="sans axis" x="500.0" y="408.0" text-anchor="middle">Rules in the list</text>
  <line x1="32.0" y1="432.0" x2="648.0" y2="432.0" stroke="#D3DBD7" stroke-width="1"/>
  <text class="sans foot" x="32.0" y="458.0">Sonnet&#x27;s and Opus&#x27;s lines sit on top of each other at 100%. Each point is 108 rule</text>
  <text class="sans foot" x="32.0" y="477.0">checks over 36 emails. Costs are what the command-line tool reported, which writes</text>
  <text class="sans foot" x="32.0" y="496.0">every list to its cache at full price. A system reusing one list would pay far less</text>
  <text class="sans foot" x="32.0" y="515.0">for each reply after the first.</text>
</svg>
