<svg xmlns="http://www.w3.org/2000/svg" width="680" height="550" viewBox="0 0 680 550" role="img" aria-labelledby="title desc">
  <title id="title">Claude didn&#x27;t lose the rule. The bill grew.</title>
  <desc id="desc">Two line charts. Left, share of the rules that applied which each reply got right, by number of rules in the list, 6, 50, 200, 800. Haiku 5.5: 98.1%, 100.0%, 98.1%, 97.2%; Sonnet 5.5: 100.0%, 100.0%, 100.0%, 100.0%; Opus 5.5: 100.0%, 100.0%, 100.0%, 100.0%. Right, cost per reply in US dollars as the tool reported it. Haiku 5.5: $0.0007, $0.0010, $0.0023, $0.0068; Sonnet 5.5: $0.0084, $0.0158, $0.0404, $0.1288; Opus 5.5: $0.0147, $0.0296, $0.0793, $0.2555.</desc>
  <style>
    text { stroke: none; }
    .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
    .sans  { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h1 { font-size: 26px; font-weight: 600; fill: #191F1D; }
    .sub { font-size: 14.5px; fill: #3F4945; }
    .label { font-size: 11px; font-weight: 700; letter-spacing: 1.1px; fill: #5C6964; }
    .row { font-size: 14.5px; fill: #191F1D; }
    .rowb { font-size: 14.5px; font-weight: 600; fill: #191F1D; }
    .cell { font-size: 13.5px; fill: #3F4945; }
    .val { font-size: 14px; font-weight: 700; fill: #191F1D; }
    .num { font-size: 14px; fill: #3F4945; }
    .axis { font-size: 12px; fill: #5C6964; }
    .foot { font-size: 13.5px; fill: #3F4945; }
  </style>
  <text class="serif h1" x="32.0" y="44.0">Claude didn&#x27;t lose the rule. The bill grew.</text>
  <text class="sans sub" x="32.0" y="72.0">36 customer emails, three rules applying to each, inside lists of 6 to 800</text>
  <text class="sans sub" x="32.0" y="92.0">rules. Note the left axis starts at 90%.</text>
  <line x1="32.0" y1="112.0" x2="648.0" y2="112.0" stroke="#D3DBD7" stroke-width="1"/>
  <circle cx="37" cy="136" r="4.5" fill="#0B7A4F"/>
  <text class="sans cell" x="47.0" y="140.0">Opus 5.5</text>
  <circle cx="143" cy="136" r="4.5" fill="#3D5A98"/>
  <text class="sans cell" x="153.0" y="140.0">Sonnet 5.5</text>
  <circle cx="249" cy="136" r="4.5" fill="#B4690E"/>
  <text class="sans cell" x="259.0" y="140.0">Haiku 5.5</text>
  <text class="sans label" x="40.0" y="170.0">RULES THAT APPLIED, GOT RIGHT</text>
  <line x1="74.0" y1="366.0" x2="302.0" y2="366.0" stroke="#D3DBD7" stroke-width="1"/>
  <text class="sans axis" x="66.0" y="370.0" text-anchor="end">90%</text>
  <line x1="74.0" y1="281.0" x2="302.0" y2="281.0" stroke="#D3DBD7" stroke-width="1"/>
  <text class="sans axis" x="66.0" y="285.0" text-anchor="end">95%</text>
  <line x1="74.0" y1="196.0" x2="302.0" y2="196.0" stroke="#D3DBD7" stroke-width="1"/>
  <text class="sans axis" x="66.0" y="200.0" text-anchor="end">100%</text>
  <text class="sans axis" x="74.0" y="388.0" text-anchor="middle">6</text>
  <text class="sans axis" x="150.0" y="388.0" text-anchor="middle">50</text>
  <text class="sans axis" x="226.0" y="388.0" text-anchor="middle">200</text>
  <text class="sans axis" x="302.0" y="388.0" text-anchor="middle">800</text>
  <polyline points="74.0,196.0 150.0,196.0 226.0,196.0 302.0,196.0" fill="none" stroke="#0B7A4F" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="74.0" cy="196.0" r="4.5" fill="#0B7A4F" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="150.0" cy="196.0" r="4.5" fill="#0B7A4F" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="226.0" cy="196.0" r="4.5" fill="#0B7A4F" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="302.0" cy="196.0" r="4.5" fill="#0B7A4F" stroke="#FFFFFF" stroke-width="2"/>
  <polyline points="74.0,196.0 150.0,196.0 226.0,196.0 302.0,196.0" fill="none" stroke="#3D5A98" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="74.0" cy="196.0" r="4.5" fill="#3D5A98" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="150.0" cy="196.0" r="4.5" fill="#3D5A98" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="226.0" cy="196.0" r="4.5" fill="#3D5A98" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="302.0" cy="196.0" r="4.5" fill="#3D5A98" stroke="#FFFFFF" stroke-width="2"/>
  <polyline points="74.0,227.5 150.0,196.0 226.0,227.5 302.0,243.2" fill="none" stroke="#B4690E" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="74.0" cy="227.5" r="4.5" fill="#B4690E" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="150.0" cy="196.0" r="4.5" fill="#B4690E" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="226.0" cy="227.5" r="4.5" fill="#B4690E" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="302.0" cy="243.2" r="4.5" fill="#B4690E" stroke="#FFFFFF" stroke-width="2"/>
  <text class="sans val" x="302.0" y="187.0" text-anchor="end">Sonnet, Opus 100%</text>
  <text class="sans val" x="302.0" y="265.2" text-anchor="end">Haiku 97.2%</text>
  <text class="sans axis" x="188.0" y="408.0" text-anchor="middle">Rules in the list</text>
  <text class="sans label" x="376.0" y="170.0">COST PER REPLY</text>
  <line x1="410.0" y1="366.0" x2="590.0" y2="366.0" stroke="#D3DBD7" stroke-width="1"/>
  <text class="sans axis" x="402.0" y="370.0" text-anchor="end">$0.00</text>
  <line x1="410.0" y1="309.3" x2="590.0" y2="309.3" stroke="#D3DBD7" stroke-width="1"/>
  <text class="sans axis" x="402.0" y="313.3" text-anchor="end">$0.10</text>
  <line x1="410.0" y1="252.7" x2="590.0" y2="252.7" stroke="#D3DBD7" stroke-width="1"/>
  <text class="sans axis" x="402.0" y="256.7" text-anchor="end">$0.20</text>
  <line x1="410.0" y1="196.0" x2="590.0" y2="196.0" stroke="#D3DBD7" stroke-width="1"/>
  <text class="sans axis" x="402.0" y="200.0" text-anchor="end">$0.30</text>
  <text class="sans axis" x="410.0" y="388.0" text-anchor="middle">6</text>
  <text class="sans axis" x="470.0" y="388.0" text-anchor="middle">50</text>
  <text class="sans axis" x="530.0" y="388.0" text-anchor="middle">200</text>
  <text class="sans axis" x="590.0" y="388.0" text-anchor="middle">800</text>
  <polyline points="410.0,357.6 470.0,349.3 530.0,321.0 590.0,221.2" fill="none" stroke="#0B7A4F" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="410.0" cy="357.6" r="4.5" fill="#0B7A4F" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="470.0" cy="349.3" r="4.5" fill="#0B7A4F" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="530.0" cy="321.0" r="4.5" fill="#0B7A4F" stroke="#FFFFFF" stroke-width="2"/>
